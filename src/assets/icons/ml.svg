<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ml-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e24aa" />
      <stop offset="100%" stop-color="#ab47bc" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#ml-grad)" />
  <!-- Brain Network Nodes -->
  <circle cx="50" cy="50" r="8" fill="#ffffff" />
  <circle cx="25" cy="35" r="6" fill="#ffffff" opacity="0.8" />
  <circle cx="25" cy="65" r="6" fill="#ffffff" opacity="0.8" />
  <circle cx="75" cy="35" r="6" fill="#ffffff" opacity="0.8" />
