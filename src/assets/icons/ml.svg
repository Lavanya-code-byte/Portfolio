  <line x1="25" y1="65" x2="50" y2="50" stroke="#ffffff" stroke-width="3" opacity="0.6" />
  <line x1="75" y1="35" x2="50" y2="50" stroke="#ffffff" stroke-width="3" opacity="0.6" />
  <line x1="75" y1="65" x2="50" y2="50" stroke="#ffffff" stroke-width="3" opacity="0.6" />
  <line x1="25" y1="35" x2="25" y2="65" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="75" y1="35" x2="75" y2="65" stroke="#ffffff" stroke-width="2" opacity="0.4" />
