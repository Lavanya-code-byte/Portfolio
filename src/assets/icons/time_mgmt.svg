<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#tm-grad)" />
  <!-- Stopwatch / Clock with Check -->
  <circle cx="50" cy="54" r="26" fill="none" stroke="#ffffff" stroke-width="5" />
  <!-- Top button -->
  <rect x="46" y="20" width="8" height="6" rx="2" fill="#ffffff" />
  <!-- Clock hands -->
  <line x1="50" y1="54" x2="50" y2="38" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="54" x2="62" y2="54" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="54" r="3" fill="#ffffff" />
</svg>
