<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="skl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#skl-grad)" />
  <!-- Decision Nodes / Branches -->
  <line x1="30" y1="50" x2="65" y2="30" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="30" y1="50" x2="65" y2="70" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <circle cx="30" cy="50" r="12" fill="#3b7bc4" />
  <circle cx="65" cy="30" r="10" fill="#ffffff" />
  <circle cx="65" cy="70" r="10" fill="#ffffff" />
  <!-- Text monogram inside root node -->
  <text x="30" y="52" dominant-baseline="central" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#ffffff">sklearn</text>
</svg>
