<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#dl-grad)" />
  <!-- Deep Neural Network Layers (3 layers: 2 - 3 - 2) -->
  <!-- Layer connections -->
  <line x1="24" y1="36" x2="50" y2="26" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="24" y1="36" x2="50" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="24" y1="36" x2="50" y2="74" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="24" y1="64" x2="50" y2="26" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="24" y1="64" x2="50" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="24" y1="64" x2="50" y2="74" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  
  <line x1="50" y1="26" x2="76" y2="36" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="50" y1="26" x2="76" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="50" y1="50" x2="76" y2="36" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="50" y1="50" x2="76" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="50" y1="74" x2="76" y2="36" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <line x1="50" y1="74" x2="76" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.6" />

  <!-- Input nodes -->
  <circle cx="24" cy="36" r="6" fill="#FDE047" />
  <circle cx="24" cy="64" r="6" fill="#FDE047" />

  <!-- Hidden nodes -->
  <circle cx="50" cy="26" r="6" fill="#ffffff" />
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
  <circle cx="50" cy="74" r="6" fill="#ffffff" />

  <!-- Output nodes -->
  <circle cx="76" cy="36" r="6" fill="#38BDF8" />
  <circle cx="76" cy="64" r="6" fill="#38BDF8" />
</svg>
