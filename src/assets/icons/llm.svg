<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="llm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#llm-grad)" />
  <!-- Dialogue bubbles with neural node connections -->
  <rect x="22" y="24" width="44" height="30" rx="8" fill="#ffffff" />
  <polygon points="32,54 40,54 34,62" fill="#ffffff" />
  <!-- Text tokens inside speech bubble -->
  <line x1="30" y1="34" x2="56" y2="34" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="42" x2="48" y2="42" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" />
  <!-- Second bubble / network connection -->
  <circle cx="70" cy="58" r="14" fill="#FDE047" />
  <line x1="58" y1="45" x2="68" y2="52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <text x="70" y="62" dominant-baseline="central" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#1E1B4B">AI</text>
</svg>
